name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Build manuel de test (aucune Release GitHub ne sera publiée sans tag)"
        required: false
        default: "test manuel"

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================
  # LINUX (amd64) : binaires + paquets .deb
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install system build dependencies (Nuitka onefile)
        run: sudo apt-get update && sudo apt-get install -y patchelf dpkg-dev

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: uv run pytest tests -v

      - name: Build binaries + .deb packages
        run: ./build.sh

      - name: Archive raw Linux binaries
        run: |
          mkdir -p artifacts
          tar -C dist -czf artifacts/anonymous-linux-amd64.tar.gz anonymous
          tar -C dist -czf artifacts/anonymous-server-linux-amd64.tar.gz anonymous-server
          cp dist/*.deb artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifacts/*

  # ============================================================
  # WINDOWS (amd64) : exécutables .exe
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: uv run pytest tests -v

      - name: Build client (Nuitka onefile)
        run: >
          uv run python -m nuitka
          --onefile
          --mingw64
          --follow-imports
          --include-module=websockets.asyncio.client
          --include-package=cryptography
          --include-package=requests
          --output-dir=dist
          --output-filename=anonymous.exe
          client/src/main.py

      - name: Build server (Nuitka onefile)
        run: >
          uv run python -m nuitka
          --onefile
          --mingw64
          --follow-imports
          --include-package=uvicorn
          --include-package=starlette
          --include-package=fastapi
          --include-package=pydantic
          --include-package=websockets
          --include-package=cryptography
          --include-package=argon2
          --output-dir=dist
          --output-filename=anonymous-server.exe
          server/src/main.py

      - name: Package zip archives
        shell: bash
        run: |
          mkdir -p artifacts
          cp etc/anonymous/server.toml dist/server.toml.example
          cp README.md dist/README.md
          (cd dist && 7z a -tzip ../artifacts/anonymous-windows-amd64.zip anonymous.exe README.md)
          (cd dist && 7z a -tzip ../artifacts/anonymous-server-windows-amd64.zip anonymous-server.exe server.toml.example README.md)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/*

  # ============================================================
  # IMAGE DOCKER — publiée sur GitHub Container Registry (ghcr.io)
  # ============================================================
  build-docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # Le build est vérifié sur chaque déclenchement (y compris manuel),
    # mais on ne PUSH l'image que pour un vrai tag de version — un
    # test manuel ne doit pas polluer le registre.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}/anonymous-server:latest
            ghcr.io/${{ github.repository }}/anonymous-server:${{ github.ref_name }}

  # ============================================================
  # PUBLICATION DE LA RELEASE GITHUB
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # Uniquement pour un vrai tag `v*` — un déclenchement manuel
    # (workflow_dispatch) construit et teste tout, mais ne publie rien.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          name: "Anonymous ${{ github.ref_name }}"
