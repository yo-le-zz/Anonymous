[project]
name = "anonymous"
version = "1.0.2"
description = "Chat chiffré de bout en bout, décentralisé, sans compte ni identité persistante"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "argon2-cffi>=23.1.0",
    "requests>=2.31.0",
    "websockets>=13.0",
    "windows-curses>=2.3.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "nuitka[onefile]>=2.8",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
